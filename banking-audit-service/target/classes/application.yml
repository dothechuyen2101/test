server:
  port: 8085

spring:
  application:
    name: banking-audit-service
  datasource:
    url: ${BANKING_DATASOURCE_URL:jdbc:h2:mem:audit;MODE=Oracle;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${BANKING_DATASOURCE_USER:sa}
    password: ${BANKING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: banking-audit-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

banking:
  security:
    api-permit-all: true
  kafka:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false
